apiVersion: v1
kind: Namespace
metadata:
  name: virtualteach
---
apiVersion: v1
kind: Secret
metadata:
  name: virtualteach-secrets
  namespace: virtualteach
type: Opaque
stringData:
  MARIADB_USER: replace-with-a-database-user
  MARIADB_PASSWORD: replace-with-a-strong-database-password
  MARIADB_ROOT_PASSWORD: replace-with-a-strong-root-password
  JWT_SECRET: replace-with-a-random-secret-at-least-32-characters-long
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: virtualteach
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: virtualteach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - name: mariadb
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: virtual_teaching
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: virtualteach-secrets
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: virtualteach-secrets
                  key: MARIADB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: virtualteach-secrets
                  key: MARIADB_ROOT_PASSWORD
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -u root -p"$MARIADB_ROOT_PASSWORD" --silent
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -u root -p"$MARIADB_ROOT_PASSWORD" --silent
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: virtualteach
spec:
  selector:
    app: mariadb
  ports:
    - name: mariadb
      port: 3306
      targetPort: mariadb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: virtualteach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-mariadb
          image: mariadb:11.4
          command:
            - sh
            - -c
            - until mariadb-admin ping -h mariadb -P 3306 -u "$MARIADB_USER" -p"$MARIADB_PASSWORD" --silent; do sleep 2; done
          env:
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: virtualteach-secrets
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: virtualteach-secrets
                  key: MARIADB_PASSWORD
      containers:
        - name: backend
          image: ghcr.io/your-owner/your-repository-backend:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: virtual_teaching
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: virtualteach-secrets
                  key: MARIADB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: virtualteach-secrets
                  key: MARIADB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: virtualteach-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: "86400000"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: virtualteach
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: virtualteach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-owner/your-repository-frontend:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: virtualteach
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
