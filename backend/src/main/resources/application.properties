# XAMPP ships MariaDB, which uses the MySQL JDBC driver.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:virtual_teaching}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

jwt.secret=${JWT_SECRET:abcdefghijklmnopqrstuvwxyz1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.demo-admin.email=${DEMO_ADMIN_EMAIL:admin@virtualteaching.com}
app.demo-admin.password=${DEMO_ADMIN_PASSWORD:AdminPass123!}

server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:4174,http://127.0.0.1:4174}
app.file-storage-dir=${FILE_STORAGE_DIR:uploads}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:mrnfxyxs}
